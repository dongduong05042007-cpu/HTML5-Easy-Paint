<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Paint - Đăng nhập</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #202124,
                    #303134
                );

            color: white;

        }

        .login-container {

            width: 420px;

            max-width: 90%;

            padding: 40px;

            background: #2d2f33;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.45);

        }

        .logo {

            width: 80px;

            height: 80px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: white;

            font-size: 42px;

        }

        h1 {

            text-align: center;

            margin-bottom: 8px;

            font-size: 30px;

        }

        .subtitle {

            text-align: center;

            color: #bfc0c3;

            margin-bottom: 30px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #555;

            border-radius: 10px;

            background: #202124;

            color: white;

            font-size: 16px;

            outline: none;

        }

        input:focus {

            border-color: #4caf50;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #4caf50;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }

        button:hover {

            background: #43a047;

        }

        button:disabled {

            background: #666;

            cursor: not-allowed;

        }

        #message {

            min-height: 24px;

            margin-top: 20px;

            text-align: center;

            font-weight: bold;

        }

        .success {

            color: #66bb6a;

        }

        .error {

            color: #ef5350;

        }

        .register-text {

            margin-top: 25px;

            text-align: center;

            color: #aaa;

            font-size: 14px;

        }

        .register-button {

        width: auto;

        margin-top: 12px;

        padding: 10px 20px;

        background: transparent;

        border: 1px solid #4caf50;

        color: #66bb6a;

        font-size: 14px;

        }

        .register-button:hover {

        background: #4caf50;

        color: white;

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            🎨
        </div>


        <h1>
            Paint
        </h1>


        <p class="subtitle">
            Đăng nhập vào tài khoản của bạn
        </p>


        <form id="loginForm">


            <div class="form-group">

                <label for="username">
                    Tên đăng nhập
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Nhập tên đăng nhập"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Đăng nhập
            </button>


        </form>


        <div id="message"></div>


        <div class="register-text">

    Chưa có tài khoản?

    <br>

    <button
        type="button"
        class="register-button"
        onclick="window.location.href='register.html'"
    >
        Đăng ký tài khoản
    </button>

</div>

    </div>

    <script src="login.js"></script>

</body>

</html>
