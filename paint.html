<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paint Studio</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.6.3/jquery.min.js"></script>
<script src="apiService.js"></script>
<script src="paint.js"></script>
<script src="init.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#202124;
    color:white;
    overflow:hidden;
}

#container{
    display:flex;
    height:100vh;
}

/*================ LEFT TOOLBAR ================*/

#colorToolbar{

    width:90px;
    background:#2b2d31;
    padding:30px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    box-shadow:4px 0 10px rgba(0,0,0,.4);
}

/* Color Buttons */

#colorToolbar div[id]{

    width:60px;
    height:60px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;

}

#colorToolbar div[id]:hover{

    transform:scale(1.1);
    border:2px solid white;

}

img{

    width:45px;
    height:45px;
    border-radius:8px;

}

input[type=color]{

    width:50px;
    height:50px;
    border:none;
    background:none;

}

/* Buttons */

button{

    width:70px; 
    padding:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    background:#3d4046;
    transition:.2s;

}

button:hover{

    background:#5b5f68;

}

/*================ MAIN AREA ================*/

#canvasDiv{

    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#777;

}

#imageView{

    width:900px;
    height:600px;

    background:white;
    border-radius:12px;
    box-shadow:0 0 35px rgba(0,0,0,.55);

}

#canvasDiv{

    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#777;

}

#imageView{

    width:900px;
    height:600px;

    background:white;
    border-radius:12px;
    box-shadow:0 0 35px rgba(0,0,0,.55);

}

/*================ RIGHT PANEL ================*/

#rightPanel{
    width:330px;
    height:100vh;          
    background:#2d2d2d;
    color:white;
    padding:20px;
    overflow-y:auto;       
    overflow-x:hidden;
    box-shadow:-4px 0 15px rgba(0,0,0,.4);
}

#rightPanel::-webkit-scrollbar{
    width:8px;
}

#rightPanel::-webkit-scrollbar-track{
    background:#2d2d2d;
}

#rightPanel::-webkit-scrollbar-thumb{
    background:#666;
    border-radius:10px;
}

#rightPanel::-webkit-scrollbar-thumb:hover{
    background:#888;
}

.card{

    background:#3b3d42;
    border-radius:15px;
    padding:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.3);

}

.card h3{

    margin-bottom:10px;
    font-size:15px;

}

select,
input[type=text],
input[type=range]{

    width:100%;

}

#draftList{

    max-height:150px;
    overflow:auto;

}

.draft-card{

	background:#444;

	padding:12px;

	border-radius:10px;

	margin-bottom:10px;

}

#stats{

    font-size:13px;
    color:#ddd;

}

.cloud-modal {
    display: none;

    position: fixed;

    z-index: 9999;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background-color: rgba(0, 0, 0, 0.6);
}


.cloud-modal-content {
    width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    background: #2d2d2d;
    color: white;
    margin: 8% auto;
    padding: 20px;
    border-radius: 10px;
}


.cloud-modal-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}


.cloud-modal-header h2 {

    margin: 0;
}


#btnCloseCloud {

    border: none;

    background: red;

    color: white;

    font-size: 18px;

    width: 35px;

    height: 35px;

    border-radius: 5px;

    cursor: pointer;
}


.cloud-drawing-item {
    border: 1px solid #555;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 6px;
    cursor: pointer;
    background: #444;
    color: white;
}

.cloud-drawing-item:hover {

    background: #e9e9e9;
}
/* BRUSH PANEL */

#brushType {

    width:100%;

    padding:10px;

    margin-top:8px;

    border:none;

    border-radius:8px;

    background:#202124;

    color:white;

    font-size:14px;

    cursor:pointer;

}


#brushType:hover {

    background:#35363a;

}


#brushSize,
#brushOpacity {

    width:100%;

    cursor:pointer;

}


#brushSizeValue,
#brushOpacityValue {

    text-align:right;

    font-size:12px;

    color:#bbb;

    margin-top:4px;

}

</style>

</head>

<body>

<div id="container">

    <!-- LEFT TOOLBAR -->

    <div id="colorToolbar">

        <div id="red" style="background:red"></div>
        <div id="pink" style="background:pink"></div>
        <div id="fuchsia" style="background:fuchsia"></div>
        <div id="orange" style="background:orange"></div>
        <div id="yellow" style="background:yellow"></div>
        <div id="lime" style="background:lime"></div>
        <div id="green" style="background:green"></div>
        <div id="blue" style="background:blue"></div>
        <div id="purple" style="background:purple"></div>
        <div id="black" style="background:black"></div>
        <div id="white" style="background:white"></div>

        <input type="color" id="customColor">

        <img id="fill" src="fill.png">

        <img id="catImg" src="cat.png">

        <img id="dogImg" src="dog.png">

        <img id="dragonFlyImg" src="fly.png">

        <img id="ladyBugImg" src="bug.png">

        <img id="heartImg" src="heart.png">

        <button id="eraser">Erase</button>

        <button id="clear">Clear</button>

        <button id="btnSaveCloud">Lưu lên Cloud</button>

    </div>

    <!-- CANVAS -->

    <div id="canvasDiv">

        <canvas id="imageView"></canvas>

    </div>

    <!-- RIGHT PANEL -->

    <div id="rightPanel">

        <div class="card">

    <h3>🖌️ Brush</h3>

    <!-- LOẠI CỌ -->
    <label for="brushType">
        Brush Type
    </label>

    <select id="brushType">

        <option value="pen">
            🖊️ Pen
        </option>

        <option value="pencil">
            ✏️ Pencil
        </option>

        <option value="marker">
            🖌️ Marker
        </option>

        <option value="crayon">
            🖍️ Crayon
        </option>

        <option value="airbrush">
            🌫️ Airbrush
        </option>

        <option value="spray">
            💨 Spray
        </option>

        <option value="neon">
            ✨ Neon
        </option>

        <option value="calligraphy">
            🖋️ Calligraphy
        </option>

    </select>

    <br><br>


    <!-- KÍCH THƯỚC CỌ -->

    <label for="brushSize">
        Brush Size
    </label>

    <input
        type="range"
        id="brushSize"
        min="1"
        max="50"
        value="2"
    >

    <div id="brushSizeValue">
        Size: 2
    </div>

    <br>


    <!-- ĐỘ MỜ -->

    <label for="brushOpacity">
        Opacity
    </label>

    <input
        type="range"
        id="brushOpacity"
        min="10"
        max="100"
        value="100"
    >

    <div id="brushOpacityValue">
        Opacity: 100%
    </div>

    <br><br>


    <!-- FILL -->

    <label>

        <input
            type="checkbox"
            id="fillShape"
        >

        Fill Shape

    </label>

    <br><br>


    <!-- GLOW -->

    <label>

        <input
            type="checkbox"
            id="glow"
        >

        Glow Effect

    </label>

</div>

        <div class="card">

            <h3>Shape Tool</h3>

            <select id="shapeTool">

                <option value="pen">Pen</option>
                <option value="line">Line</option>
                <option value="rect">Rectangle</option>
                <option value="circle">Circle</option>
                <option value="text">Text</option>

            </select>

            <input
            type="text"
            id="textInput"
            placeholder="Enter Text"
            style="margin-top:10px;display:none;">

        </div>

        <div class="card">

            <h3>Project</h3>

            <input
            type="text"
            id="draftName"
            placeholder="Project Name">

            <br><br>

            <button id="saveDraft">Save</button>

            <br><br>

            <button id="exportProject">Export</button>

            <br><br>

            <input
            type="file"
            id="importProject"
            accept=".json">

            <br><br>

            <button id="clearAutoSave">

                Clear Auto Save

            </button>
            <button id="btnOpenCloud">Mở từ Cloud</button>
        </div>

        <div class="card">

            <h3>Drafts</h3>

            <div id="draftList"></div>

        </div>

        <div class="card">

            <h3>Status</h3>

            <div id="stats">0 0</div>

        </div>

    </div>
    <div id="cloudModal" class="cloud-modal">

    <div class="cloud-modal-content">

        <div class="cloud-modal-header">

            <h2>Danh sách bài vẽ Cloud</h2>

            <button id="btnCloseCloud">X</button>

        </div>

        <div id="cloudDrawingList">

            <p>Đang tải...</p>

        </div>

    </div>

</div>

</div>

</body>
</html>
